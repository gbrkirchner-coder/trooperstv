name: Seite aktualisieren

on:
  schedule:
    - cron: '*/30 * * * *'   # alle 30 Minuten (GitHub startet teils einige Minuten später)
  push:
    branches: [main]
  workflow_dispatch:          # manuell über „Run workflow“

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Daten von der Brawl Stars API und YouTube holen
        run: node scripts/build-data.mjs
        env:
          BS_API_KEY: ${{ secrets.BS_API_KEY }}
          CLUB_TAG: '#2VRLRP9PU'
          USE_ROYALEAPI_PROXY: 'true'
          YT_CHANNEL_ID: UCb0TxLVVkeo37lrNc8sl3kA
          SITE_URL: https://troopers.tv

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4

      # GitHub pausiert Zeitpläne nach 60 Tagen ohne Aktivität – einmal im Monat ein kleines Lebenszeichen
      - name: Lebenszeichen (monatlich)
        if: github.event_name == 'schedule'
        run: |
          if [ "$(date -u +%d%H)" = "0100" ]; then   # am 1. des Monats zwischen 0 und 1 Uhr UTC
            date -u +%Y-%m > .lebenszeichen
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .lebenszeichen
            git diff --staged --quiet || (git commit -m "Monatliches Lebenszeichen" && git push)
          fi
